name: Build and Release Plasmoid

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'install.sh'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'install.sh'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package
    runs-on: ubuntu-latest
    container:
      image: fedora:40

    steps:
      - name: Pre-install Git
        run: dnf install -y git

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          dnf install -y cmake gcc-c++ extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel \
            libplasma-devel kf6-ki18n-devel kf6-kcoreaddons-devel zip

      - name: Compile C++ Spine Plugin
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Create Plasmoid Archive
        run: |
          cd package
          zip -r ../l2d.arona.plana.bluearchive ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasmoid-package
          path: l2d.arona.plana.bluearchive

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: plasmoid-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Main Build"
          files: l2d.arona.plana.bluearchive
          body: "Automated build of the latest Blue Archive Live2D wallpaper. Download the `.plasmoid` file below to install."